<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>
    // Crea una variable llamada nombre y guarda dentro el texto laura.
    let nombre = "Laura";

    // Creamos una variable numéria paraguardar la edad.
    let edad = 25;

    // Creamos una variable para guardar la ciudad.
    let ciudad = "Gijón";

    // document.write() nos permite escribir contenido directamente dentro del documento html.
    document.write("<h2>Ejercicio 1</h2>");
    // Vamos a hacer una concatenación del operador +, que sirve para unir texto y variables.
    document.write("Nombre: " + nombre + "<br>");
    document.write("Edad: " + edad + "<br>");
    document.write("Ciudad: " + ciudad + "<br>");
    document.write("<br>");
    document.write("<hr>");

    // Ejercicio 2: Datos de un producto.
    // Declaración de varibles.

    let producto = "Cerebro Hackeado para estudios";
    let precio = 150;
    let cantidad = 3;

    // Creamos una variable llamada total para multiplicador precio por cantidad.
    let total = precio*cantidad;

    document.write("<h2>Ejercicio 2</h2>");
    document.write("Producto: " + producto + "<br>");
    document.write("Precio: " + precio + "<br>");
    document.write("Cantidad: " + cantidad + "<br>");
    document.write("Total: " + total + "€<br>");
    document.write("<br>");
    document.write("<hr>");

    // Ejercicio 3: Cálculo de edad.
    // Declaración de varibles.

    let nombre1 = "David";
    let anioNacimiento = 1981;
    let anioActual = 2026;

    // Calculamos la edad año actual - año nacimiento.
    let edad2 = anioActual - anioNacimiento;

    document.write("<h2>Ejercicio 3</h2>");
    document.write(nombre1 + " nació en " + anioNacimiento + " y tiene aproximadamente " + edad2 + " años.<br>");
    document.write("<br>");
    document.write("<hr>");
    

    // Ejercicio 4: Cálculo de precio.
    // Declaración de varibles.

    let producto1 = "Monitor";
    let precio1 = 200;
    let descuento = 15;
    //Calculamos cuanto dinero representa 15% de descuento.
    let cantidadDescontada = precio1*descuento/100;
    // Restamos el descuento al precio original.
    let precioFinal = precio1 - cantidadDescontada;

    document.write("<h2>Ejercicio 4</h2>");
    document.write("Producto: " + producto1 + "<br>");
    document.write("Precio original: " + precio1 + " EUR<br>");
    document.write("Descuento: " + descuento + " %<br>");
    document.write("Cantidad descontada: " + cantidadDescontada + " EUR<br>");
    document.write("Precio final: " + precioFinal + "€<br>");
    document.write("<br>");
    document.write("<hr>");

    // Ejercicio 5: Cálculo de precio.
    // Declaración de varibles.

</script>

</body>
</html>
