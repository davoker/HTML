<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // IMPORTANTE - FUNCION: `probando`; PARAMETRO que recibe: `holaMundo`.
        // A saber: `<br>` Es una etiqueta de HTML, y crea un salto de linea en el contenido HTML, si ponemos dos, una debajo de la otra, haremos un salto de línea y además dejaremos un espacio.
        function probando(holaMundo){
            document.write("Hey, que pasa ", holaMundo, "<br>");   // document.write escribe en la pagina; + o coma(,) une el texto con el valor de `holaMundo`, esto se llama "concatenar", vale tanto el símbolo '+'' como la coma(,).
            document.write(1+2);   // Aquí estamos sumando uno más dos, podemos ponerlo como: 1 + 2 o 1+2 (sin espacios), funcionará igual, es una suma al uso.
            document.write("<br>"); // Salto de línea.
            document.write("2"*"2"+"<BR>"); /* MULTIPLICACIÓN FUNCIONAL "PERO MAL ESCRITA" (NO ES LA FORMA CORRECTA): Aunque escribo el número como si fuera un caracter (texto entre comillas = texto escrito en pantalla), al meter un operando matemático ve que el caracter es un número, así que lo convierte a número y opera (hace el cálculo), pero aún así "ESTO ESTÁ MAL ESCRITO". */
            document.write(2*2);    // MULTIPLIACIÓN BIEN ESCRITA: Aquí estamos multiplicando dos por dos, AQUÍ SI ESTÁ BIEN ESCRITO, es una multiplicación al uso.
            document.write("<br>");
            document.write("2"+"2");    // El texto o número que pongamos "entre comillas" será un texto escrito en pantalla. En este ejemplo solo estamos escribiendo dos caracteres y forzando la concatenación, no opera (no calcula matemáticamente aunque estemos poniendo un +), solo está escribiendo dos seguido de dos, y veremos 22 en pantalla. Se puede poner coma (,) en lugar de '+', pero aquí estamos explicando por qué + no opera como una suma en este caso.
            document.write("<br>");
            document.write(2, 2);   // Aquí estamos concatenando dos números como si fueran caracteres, esto funciona igual que el ejemplo anterior pero sin las comillas. Al poner coma (,) estamos concateando los 2 números, así que solo escribe 22 en pantalla. Si en lugar de la coma (,) pusiéramos el '+' entonces entraría la operación y haría la suma de 2+2=4.
            document.write("<br>");
            document.write("10"/"2");   // DIVISIÓN FUNCIONAL "PERO MAL ESCRITA" (NO ES LA FORMA CORRECTA): El operador '/' es una división, es decir, dividimos 10 entre 2, resultado es 5.
            document.write("<br>");
            document.write(10/2);   // MULTIPLIACIÓN BIEN ESCRITA: El operador '/' es una división, es decir, dividimos 10 entre 2, resultado es 5.
        }

        probando("mundooooo (👉ﾟヮﾟ)👉");    // Llama a la FUNCION `probando`; el ARGUMENTO "hola mundo?" se asigna a `holaMundo`.
        </script>
    
    <script>
        // Escribe dos saltos de linea (`<br>`) para separar los ejercicios.
        document.write("<br>");
        document.write("<br>");
    </script>

</body>
</html>
