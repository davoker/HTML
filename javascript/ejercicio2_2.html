<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

// Ejercicio 1 Salida
// Creamos una función llamada 'saludar', esta función on recibe ningún parámetro.
function saludar(){
    document.write("Hola, soy un programador.<br>");
}

// Llamamos a la función para que se ejecute.
saludar();
document.write("<br>");
document.write("<hr>");

// Ejercicio 2 Mostrar un nombre.
// Creamos una función llamada 'mostrarnombre', la función recibe un parámetro llamado 'nombre', el parámetro permite enviar un dato a la función.
function mostrarNombre(nombre){
    document.write("Hola " + nombre + "!<br>");
}

mostrarNombre("David");
document.write("<br>");
document.write("<hr>");



</script>

</body>
</html>
